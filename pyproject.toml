[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv_index"
dynamic = ["version"]
description = "A personalized semantic search engine for arXiv, running on your own machine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "ollama"]

[project.optional-dependencies]
# Search on the GPU; see GPU_SEARCH in config.py.
gpu = ["torch"]

[project.scripts]
arxiv_index = "arxiv_index.__main__:main"

[project.urls]
Repository = "https://github.com/MattDupraz/arxiv_index"

[tool.setuptools]
packages = ["arxiv_index"]

[tool.setuptools.dynamic]
version = { attr = "arxiv_index.__version__" }

[tool.setuptools.package-data]
# The web UI: its pages, styles and scripts, and a vendored KaTeX.
arxiv_index = ["static/*.html", "static/*.js", "static/*.css", "static/fonts/*"]
